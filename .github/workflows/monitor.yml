name: Duke of Tokyo monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test_date:
        description: "Testdatum (YYYY-MM-DD), bv. 2027-01-30. Leeg = gewone run."
        required: false
        default: ""

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Poll
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TARGET_DATE: ${{ inputs.test_date }}
          RUN_MINUTES: ${{ inputs.test_date && '0' || '4.5' }}
        run: python3 monitor.py

      - name: Save state
        if: always() && !inputs.test_date
        uses: actions/cache/save@v4
        with:
          path: state
          key: state-${{ github.run_id }}-${{ github.run_attempt }}
